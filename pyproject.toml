[project]
name = "pfb-app"
version = "0.1.0"
description = "NiceMill: local positive-feedback drafting from collaborative-interaction videos (the evaluator checks and approves)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "vllm==0.30.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "faster-whisper",
    "streamlit",
    "pydantic>=2",
    "pyyaml",
    "opencv-python-headless",
    "pypdfium2",
    "jinja2",
    "weasyprint",
    "accelerate>=1.15.0",
    "openpyxl>=3.1.5",
    "argon2-cffi>=23.1",
]

[project.scripts]
# operator commands on the server (docs/accounts.md): uv run pfb-admin setup-code | create-admin | ...
pfb-admin = "pfb_app.admin_cli:main"

[dependency-groups]
dev = [
    "pytest",
    "python-docx",
    "pypdf[crypto]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfb_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0%2Bcu129-cp38-abi3-manylinux_2_28_x86_64.whl" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
